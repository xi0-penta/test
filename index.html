<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>≒JOY CALL QUIZ</title>
<style>
:root{
  --bg:#0f1115;
  --bg2:#151821;
  --panel:#181b22;
  --panel2:#20242d;
  --text:#f7f4e8;
  --muted:#aaa69a;
  --line:#33343a;
  --gold:#f2c84b;
  --gold2:#ffd95e;
  --gold-deep:#a77d10;
  --gold-soft:#3a3218;
  --ok:#7be0a9;
  --ng:#ff8b83;
  --shadow:0 20px 65px rgba(0,0,0,.38);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Hiragino Sans","Yu Gothic UI",sans-serif}
body{overflow:hidden}
button,a{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.app{
  position:relative;
  width:100%;
  min-height:100dvh;
  overflow:hidden;
  background:
    radial-gradient(circle at 90% 0%,rgba(242,200,75,.13),transparent 31%),
    radial-gradient(circle at 10% 100%,rgba(242,200,75,.07),transparent 32%),
    linear-gradient(180deg,#151821 0%,#0f1115 72%);
}
.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  opacity:0;visibility:hidden;pointer-events:none;
  transform:translateY(8px) scale(.995);
  transition:opacity .28s ease,transform .28s ease,visibility .28s;
}
.screen.active{opacity:1;visibility:visible;pointer-events:auto;transform:none}
.safe{padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:0 16px 10px}
.brand{min-width:0}
.kicker{font-size:9px;letter-spacing:.16em;font-weight:900;color:var(--gold);opacity:.95}
.brand-title{font-size:17px;font-weight:950;letter-spacing:.01em;margin-top:2px}
.progress-box{flex:0 0 82px;text-align:right}
.progress-num{font-size:11px;font-weight:900;color:#e9e4d6}.progress-num b{font-size:18px;color:var(--gold2)}
.progress-track{margin-top:6px;height:4px;border-radius:999px;background:#2a2d34;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#d7a90f,var(--gold2));transition:width .35s ease}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 14px 12px}
.card{width:min(100%,620px);max-height:100%;overflow:auto;border:1px solid #34353b;border-radius:22px;background:linear-gradient(180deg,rgba(29,32,40,.98),rgba(22,24,31,.98));box-shadow:var(--shadow);padding:18px}
.question-tag{display:inline-flex;align-items:center;gap:6px;min-height:25px;padding:4px 8px;border-radius:999px;border:1px solid #5a4c20;background:#2d2818;color:#f5d875;font-size:10px;font-weight:900}
.question-title{margin:13px 0 8px;font-size:22px;line-height:1.35;letter-spacing:.01em}
.call-box{margin:0 0 15px;padding:12px 13px;border-radius:14px;border:1px solid #3c3d43;background:#12141a;color:#eee9db;font-size:13px;font-weight:800;line-height:1.75}
.call-label{display:block;margin-bottom:4px;color:#807a6e;font-size:9px;font-weight:900;letter-spacing:.12em}
.choices{display:grid;gap:9px}
.choice{
  width:100%;min-height:52px;display:flex;align-items:center;gap:11px;text-align:left;padding:10px 12px;
  border:1px solid #3b3d45;border-radius:14px;background:#20232b;color:#eeeadf;cursor:pointer;
  transition:transform .12s ease,border-color .16s ease,background .16s ease,box-shadow .16s ease;
}
.choice:active{transform:scale(.985)}
.choice.selected{border-color:#d1ac32;background:#302a17;box-shadow:0 0 0 1px rgba(242,200,75,.15) inset,0 0 22px rgba(242,200,75,.07)}
.choice-letter{flex:0 0 31px;height:31px;display:grid;place-items:center;border-radius:9px;background:#15171d;border:1px solid #383b43;color:#aca89c;font-size:11px;font-weight:950}
.choice.selected .choice-letter{background:var(--gold);border-color:var(--gold);color:#292106}
.choice-text{font-size:13px;font-weight:850;line-height:1.35}
.action-area{padding-top:14px}
.primary-btn{width:100%;min-height:50px;border:0;border-radius:999px;background:linear-gradient(135deg,#e6b930,#f2c84b);color:#2b2205;font-weight:950;letter-spacing:.03em;box-shadow:0 10px 28px rgba(242,200,75,.14);cursor:pointer;transition:filter .15s ease,transform .12s ease,opacity .15s ease}
.primary-btn:disabled{opacity:.3;cursor:default;box-shadow:none}
.primary-btn:not(:disabled):active{transform:scale(.985)}
.helper{margin:8px 0 0;text-align:center;color:#77746c;font-size:9.5px}

/* suspense overlay */
.suspense{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(7,8,11,.94);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease,visibility .18s}
.suspense.show{opacity:1;visibility:visible}
.suspense-inner{text-align:center;padding:20px;width:min(90%,460px)}
.suspense-kicker{font-size:9px;letter-spacing:.22em;color:#77746c;font-weight:900}
.suspense-text{margin-top:13px;font-size:30px;font-weight:950;letter-spacing:.06em;color:#faf7ed}
.suspense-dots{display:flex;justify-content:center;gap:6px;margin-top:18px}
.suspense-dots i{display:block;width:6px;height:6px;border-radius:50%;background:#6a6250;animation:pulse 1.05s infinite ease-in-out}.suspense-dots i:nth-child(2){animation-delay:.16s}.suspense-dots i:nth-child(3){animation-delay:.32s}
@keyframes pulse{0%,100%{transform:scale(.65);opacity:.3}50%{transform:scale(1.2);opacity:1;background:var(--gold)}}

/* FX layer */
.fx{position:absolute;inset:0;z-index:40;pointer-events:none;display:none;overflow:hidden}
.fx.active{display:block}
.fx-black{position:absolute;inset:0;background:#000;opacity:0}
.fx-flash{position:absolute;inset:0;background:#fff;opacity:0}
.fx-gold{position:absolute;inset:-30%;background:radial-gradient(circle,rgba(255,225,95,.35),rgba(255,207,45,.08) 35%,transparent 63%);opacity:0;transform:scale(.4)}
.fx-streak{position:absolute;left:-20%;top:48%;width:140%;height:2px;background:#fff;box-shadow:0 0 18px #fff,0 0 38px var(--gold2);opacity:0;transform:scaleX(.05)}
.fx-word{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(72px,24vw,160px);line-height:.92;font-weight:1000;letter-spacing:-.08em;opacity:0;transform:scale(1.4);filter:blur(5px);text-shadow:0 0 35px rgba(255,255,255,.18)}
.fx-word.ok{color:#fff3af}.fx-word.ng{color:#ffb0aa}
.fx.active.freeze .fx-flash{animation:flash .90s ease-out forwards}
.fx.active.freeze .fx-streak{animation:streak 1.10s .50s ease-out forwards}
.fx.active.freeze .fx-black{animation:blackin 1.25s .90s ease-out forwards}
.fx.active.freeze .fx-word{animation:wordDrop 2.40s 2.90s cubic-bezier(.17,.84,.28,1.18) forwards}
@keyframes flash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
@keyframes streak{0%{opacity:0;transform:scaleX(.05)}35%{opacity:1}100%{opacity:0;transform:scaleX(1)}}
@keyframes blackin{to{opacity:1}}
@keyframes wordDrop{0%{opacity:0;transform:scale(1.55);filter:blur(8px)}70%{opacity:1;transform:scale(.94);filter:blur(0)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
.fx.active.gold .fx-black{animation:blackSoft 1s forwards}
.fx.active.gold .fx-gold{animation:goldBloom 5s .40s ease-out forwards}
.fx.active.gold .fx-word{animation:wordDrop 2.25s 6.25s cubic-bezier(.17,.84,.28,1.18) forwards}
@keyframes blackSoft{to{opacity:.72}}
@keyframes goldBloom{0%{opacity:0;transform:scale(.3) rotate(0)}45%{opacity:1}100%{opacity:.15;transform:scale(1.2) rotate(18deg)}}
.fx.active.revival .fx-black{animation:blackSoft .90s forwards}
.fx.active.revival .fx-word{animation:revivalFake 6.75s 1.40s ease-in-out forwards}
@keyframes revivalFake{0%{opacity:0;transform:scale(.8);filter:blur(5px);color:#ff9a93}18%{opacity:1;transform:scale(1);filter:none;color:#ff9a93}62%{opacity:1;transform:scale(1);filter:none;color:#ff9a93}69%{opacity:0;transform:translateX(-45px) rotate(-6deg);filter:blur(8px)}76%{opacity:0;transform:translateX(35px) scale(1.6);color:#fff3af}100%{opacity:1;transform:none;filter:none;color:#fff3af}}

/* answer */
.answer-card{display:flex;flex-direction:column;justify-content:center;min-height:100%;padding:20px 18px 24px}
.answer-symbol{font-size:64px;line-height:1;text-align:center;font-weight:1000;margin-bottom:7px}
.answer-symbol.ok{color:var(--ok)}.answer-symbol.ng{color:var(--ng)}
.answer-status{text-align:center;font-size:25px;font-weight:950}
.answer-correct{margin:20px 0 8px;padding:12px 14px;border-radius:14px;border:1px solid #4d472f;background:#242116;color:#f8da79;font-size:13px;font-weight:900}
.answer-explanation{margin:0;color:#cbc6b8;font-size:13px;line-height:1.75}
.next-btn{margin-top:20px}
.effect-chip{display:inline-flex;align-self:center;margin-top:12px;padding:4px 8px;border-radius:999px;border:1px solid #3a3a40;color:#77736a;font-size:8.5px;font-weight:900;letter-spacing:.08em}

/* result */
.result-screen{overflow:auto}
.result-wrap{width:min(100%,680px);margin:auto;padding:24px 14px max(28px,env(safe-area-inset-bottom))}
.result-hero{text-align:center;padding:25px 16px 18px}
.result-kicker{font-size:10px;letter-spacing:.18em;font-weight:900;color:var(--gold)}
.result-score{margin-top:8px;font-size:clamp(56px,18vw,96px);line-height:1;font-weight:1000;color:#fff0a8;text-shadow:0 0 26px rgba(242,200,75,.12)}
.result-score small{font-size:.28em;color:#a49d8b;font-weight:900;margin-left:3px}
.result-summary{margin-top:8px;color:#d0cbbd;font-size:13px;font-weight:800}
.percentile{margin-top:19px;padding:14px;border:1px solid #514621;border-radius:16px;background:#211e14}
.percentile strong{display:block;font-size:18px;color:#ffe07a}.percentile span{font-size:10px;color:#8f8878}
.chart{height:110px;display:flex;align-items:flex-end;justify-content:center;gap:4px;margin-top:13px;padding:0 5px 18px;position:relative;border-bottom:1px solid #4b4637}
.bar{position:relative;width:7.5%;max-width:34px;min-width:10px;border-radius:4px 4px 0 0;background:#4b4739;transition:height .5s ease,background .3s ease}.bar.you{background:linear-gradient(180deg,#ffe57f,#d9aa1e);box-shadow:0 0 18px rgba(242,200,75,.25)}
.bar.you::after{content:"YOU";position:absolute;left:50%;top:-19px;transform:translateX(-50%);font-size:8px;font-weight:1000;color:#ffe57f}
.chart-labels{display:flex;justify-content:space-between;color:#6f6a60;font-size:8px;margin-top:5px;padding:0 4px}
.result-list{margin-top:14px;display:grid;gap:8px}
.result-row{border:1px solid #35363d;border-radius:13px;background:#191b21;overflow:hidden}
.result-row summary{list-style:none;cursor:pointer;padding:11px 12px;display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:9px}
.result-row summary::-webkit-details-marker{display:none}
.result-q{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:#252831;color:#9f9b91;font-size:9px;font-weight:950}
.result-title{min-width:0;font-size:11px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-mark{font-size:12px;font-weight:950}.result-mark.ok{color:var(--ok)}.result-mark.ng{color:var(--ng)}
.result-detail{padding:0 12px 12px;color:#bdb8aa;font-size:11px;line-height:1.65}
.result-detail b{color:#f1d66f}
.share-box{margin-top:16px;padding:14px;border:1px solid #3f3b2e;border-radius:16px;background:#171817}
.share-title{font-size:11px;font-weight:950;color:#e5dfd0;margin-bottom:9px}
.share-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.share-grid .wide{grid-column:1/-1}
.share-btn,.nav-btn{min-height:43px;border-radius:12px;border:1px solid #3b3d44;background:#20232b;color:#eee9dd;font-size:11px;font-weight:900;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}
.share-btn.primary{background:linear-gradient(135deg,#e1b228,#f2c84b);color:#2b2205;border-color:#e9c84f}
.navs{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.nav-btn.home{grid-column:1/-1;border-color:#665824;background:#262116;color:#f2d36b}
.disclaimer{margin:14px 3px 0;color:#69665e;font-size:9px;text-align:center;line-height:1.6}

/* score animation overlay */
.score-overlay{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:#090a0d;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease,visibility .2s}
.score-overlay.show{opacity:1;visibility:visible}
.score-inner{text-align:center}.score-lead{font-size:15px;font-weight:900;color:#d9d4c7;letter-spacing:.04em}.score-rolling{margin-top:16px;font-size:86px;line-height:1;font-weight:1000;color:#ffe270;min-width:180px;font-variant-numeric:tabular-nums}.score-unit{font-size:17px;color:#8f8a7d;font-weight:900}

@media (max-height:690px){
  .topbar{padding-bottom:5px}.card{padding:14px}.question-title{font-size:19px;margin-top:9px}.call-box{font-size:11.5px;line-height:1.55;margin-bottom:10px;padding:9px 10px}.choice{min-height:44px;padding:7px 10px}.action-area{padding-top:9px}.primary-btn{min-height:45px}
}
@media (min-width:760px){
  .card{padding:24px}.question-title{font-size:25px}.choice-text{font-size:14px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="screen active safe" id="quizScreen" aria-live="polite">
    <div class="topbar">
      <div class="brand">
        <div class="kicker">FAN MADE / ≒JOY</div>
        <div class="brand-title">CALL QUIZ</div>
      </div>
      <div class="progress-box">
        <div class="progress-num"><b id="qNow">1</b> / 10</div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </div>
    <div class="stage">
      <article class="card" id="questionCard">
        <div class="question-tag" id="songTag">SONG</div>
        <h1 class="question-title" id="questionTitle"></h1>
        <div class="call-box" id="callBox"><span class="call-label">CALL</span><span id="callText"></span></div>
        <div class="choices" id="choices"></div>
        <div class="action-area">
          <button class="primary-btn" id="answerBtn" disabled>回答する</button>
          <p class="helper">選択肢を1つ選んで回答</p>
        </div>
      </article>
    </div>
  </section>

  <section class="screen safe" id="answerScreen">
    <div class="stage">
      <article class="card answer-card">
        <div class="answer-symbol" id="answerSymbol">○</div>
        <div class="answer-status" id="answerStatus">正解</div>
        <div class="answer-correct" id="answerCorrect"></div>
        <p class="answer-explanation" id="answerExplanation"></p>
        <button class="primary-btn next-btn" id="nextBtn">次の問題へ</button>
      </article>
    </div>
  </section>

  <section class="screen result-screen" id="resultScreen">
    <div class="result-wrap">
      <div class="result-hero">
        <div class="result-kicker">≒JOY CALL QUIZ - RESULT</div>
        <div class="result-score"><span id="finalScore">0</span><small>点</small></div>
        <div class="result-summary" id="resultSummary"></div>
        <div class="percentile">
          <strong id="percentileText">全ユーザーのうち上位 --%です！</strong>
          <span>※順位はクイズ演出用の目安です</span>
          <div class="chart" id="chart"></div>
          <div class="chart-labels"><span>0</span><span>50</span><span>100点</span></div>
        </div>
      </div>
      <div class="result-list" id="resultList"></div>
      <div class="share-box">
        <div class="share-title">結果をシェア</div>
        <div class="share-grid">
          <button class="share-btn primary wide" id="shareBtn">結果をシェア</button>
          <button class="share-btn" id="xBtn">Xでシェア</button>
          <button class="share-btn" id="copyBtn">結果をコピー</button>
        </div>
      </div>
      <div class="navs">
        <button class="nav-btn" id="retryBtn">もう一度挑戦</button>
        <a class="nav-btn" href="./">コールガイドを見る</a>
        <a class="nav-btn home" href="../">トップページに戻る</a>
      </div>
      <div class="disclaimer">非公式ファン向けのお遊びクイズです。MIX・口上は公演・現場によって使われ方が変わる場合があります。</div>
    </div>
  </section>

  <div class="suspense" id="suspense" aria-hidden="true">
    <div class="suspense-inner">
      <div class="suspense-kicker" id="suspenseKicker">JUDGING</div>
      <div class="suspense-text" id="suspenseText">正解は……</div>
      <div class="suspense-dots"><i></i><i></i><i></i></div>
    </div>
  </div>

  <div class="fx" id="fx" aria-hidden="true">
    <div class="fx-black"></div>
    <div class="fx-flash"></div>
    <div class="fx-gold"></div>
    <div class="fx-streak"></div>
    <div class="fx-word" id="fxWord">正解</div>
  </div>

  <div class="score-overlay" id="scoreOverlay" aria-hidden="true">
    <div class="score-inner">
      <div class="score-lead">あなたのスコアは……</div>
      <div class="score-rolling"><span id="rollingScore">00</span><span class="score-unit">点</span></div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const questions = [
    {
      song:'アマガミガール feat. DJ ALICE',
      question:'このコール、何MIX？',
      call:'ライガファイター ララララライガー<br>サイダファインダー サササササイダー<br>ドライバベイベー ドドドドドライバー',
      choices:['スペイン語MIX','園長うんち可変','闇うんち可変','ヨルバ可変3連'],
      answer:2,
      explanation:'この並びは「闇うんち可変」と呼ばれるパターンです。名称だけでは内容を推測しにくいため、実際のフレーズとセットで覚えるのが近道です。'
    },
    {

      choices:['ビスマルク','キャプテン翼MIX','魚MIX','裏ガリシア'],
      answer:0,
      explanation:'「高まるよ 高まるよ」から入り、ビスマルク、シジマール、アルシンドなどの語が続く定番の特殊コールです。'
    },
    {
      song:'その先はイグザルト',
      question:'この有名な一節は何MIX？',
      call:'俺とお前の赤い糸／おーれの おれの ○○<br>いやいやいやいや いやいやいやいや／おーれーの ○○<br>サイン コサイン タンジェント',
      choices:['ガチ恋口上','三角関数MIX','ジャンキー口上','チェルガ口上'],
      answer:1,
      explanation:'「俺とお前の赤い糸」から展開し、最後に「サイン・コサイン・タンジェント」が入るのが大きな手掛かりです。'
    },
    {
      song:'0120お助け屋さん',
      question:'キャラクター名が並ぶこれは？',
      call:'キキ ララ クロミ／シナモン バツ丸 ハローキティ<br>ケロッピー マイメロディー／どんじゃらほいって知ってる〜？<br>みんな大好きポムポムプリン',

    },
    {

      choices:['チェルガ口上','シンデレラ口上','銀河口上','ジャンキー口上'],
      answer:0,
      explanation:'この一節はチェルガ口上として使われる形です。曲名に「シンデレラ」が入っていますが、ここで問っている口上名とは別です。'
    },
    {
      song:'今、恋をしている',
      question:'「農場 舞 海鵜 跳」から展開するこれは？',
      call:'農場 舞 海鵜 跳<br>除去 飛 化繊 振動 海女 繊維 人造 火<br>虎 火 虎 火／虎 虎 虎 虎 …',
      choices:['アイヌ日可変','アッチェレ','可変3連#2','ジャパ黒服'],
      answer:1,

    },
    {
      song:'ニアジョイ音頭',
      question:'5・4・3・2・1！で始まるこれは？',
      call:'打ち上げろ！打ち上げろ！5・4・3・2・1！<br>菊 牡丹 瀧 蜂<br>千輪 葉落 冠菊',
      choices:['玉響MIX','花火MIX','朧月MIX','十二星座MIX'],
      answer:1,
      explanation:'「打ち上げろ」「5・4・3・2・1」に続き、菊・牡丹・瀧・蜂など花火に関係する語が並びます。'
    },
    {
      song:'いま、月は満ちる',
      question:'月の言葉が連なるこれは？',
      call:'有明 十六夜 朧月<br>朔月 三光 氷輪 月下<br>金烏玉兎 日月星辰<br>幻月 無月 天満月',
      choices:['朧月MIX','銀河口上','十二星座MIX','玉響MIX'],
      answer:0,
      explanation:'有明、十六夜、朧月、朔月など、月に関する語が連続するMIXです。'
    },
    {
      song:'夢見る♡アイドル',
      question:'この特徴的なコールは？',
      call:'L！I！N！E！<br>LINEをやらない 👏 ○○',
      choices:['ゆんぼMIX','LINEをやらない','闇うんち可変','トーマスキャンセル'],
      answer:1,
      explanation:'「L・I・N・E」から「LINEをやらない」と続く、そのままの呼び名で整理されるコールです。'
    },
    {
      song:'笑って フラジール',
      question:'「ライオン トラ チーター」から始まるこれは？',
      call:'ライオン トラ チーター／ラタラタ ラトラーター<br>サイ ゴリラ ゾウ／サゴーゾ サゴーゾー<br>栄養 栄養 栄養 栄養／カプサイシンって知ってるー？',
      choices:['キャプテン翼MIX','魚MIX','チキパMIX','サンリオMIX'],
      answer:2,
      explanation:'「ライオン・トラ・チーター」から始まり、「サイ・ゴリラ・ゾウ」などへ続く特徴的なフレーズで判別できます。'
    }
  ];

  const $ = (id) => document.getElementById(id);
  const quizScreen = $('quizScreen');
  const answerScreen = $('answerScreen');
  const resultScreen = $('resultScreen');
  const suspense = $('suspense');
  const fx = $('fx');
  const fxWord = $('fxWord');
  const scoreOverlay = $('scoreOverlay');

  let current = 0;
  let selected = null;
  let locked = false;
  let results = [];
  let lastEffect = 'normal';

  function sleep(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

  function setScreen(el){
    [quizScreen,answerScreen,resultScreen].forEach(s => s.classList.toggle('active', s === el));
  }

  function renderQuestion(){
    const q = questions[current];
    selected = null;
    locked = false;
    $('qNow').textContent = current + 1;
    $('progressFill').style.width = `${((current + 1) / questions.length) * 100}%`;
    $('songTag').textContent = q.song;
    $('questionTitle').textContent = q.question;
    $('callText').innerHTML = q.call;
    $('answerBtn').disabled = true;
    const choices = $('choices');
    choices.innerHTML = '';
    q.choices.forEach((text, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'choice';
      btn.innerHTML = `<span class="choice-letter">${String.fromCharCode(65+i)}</span><span class="choice-text"></span>`;
      btn.querySelector('.choice-text').textContent = text;
      btn.addEventListener('click', () => {
        if(locked) return;
        selected = i;
        [...choices.children].forEach((c, idx) => c.classList.toggle('selected', idx === i));
        $('answerBtn').disabled = false;
      });
      choices.appendChild(btn);
    });
    setScreen(quizScreen);
  }

  function chooseEffect(isCorrect){
    const r = Math.random();
    // 通常演出は10%。残り90%は特殊演出を分散して抽選。
    if(r < 0.10) return 'normal';
    if(isCorrect){
      if(r < 0.30) return 'revival'; // 20%
      if(r < 0.55) return 'freeze';  // 25%
      if(r < 0.80) return 'gold';    // 25%
      return 'long';                 // 20%
    }
    if(r < 0.45) return 'freeze';    // 35%
    if(r < 0.75) return 'gold';      // 30%
    return 'long';                   // 25%
  }

  async function showNormalSuspense(effect){
    $('suspenseKicker').textContent = effect === 'long' ? 'STILL JUDGING' : 'JUDGING';
    $('suspenseText').textContent = '正解は……';
    suspense.classList.add('show');
    suspense.setAttribute('aria-hidden','false');
    await sleep(effect === 'long' ? 24000 : 2800);
    suspense.classList.remove('show');
    suspense.setAttribute('aria-hidden','true');
  }

  async function showFx(effect,isCorrect){
    fx.className = `fx active ${effect}`;
    fx.setAttribute('aria-hidden','false');
    fxWord.className = `fx-word ${isCorrect ? 'ok' : 'ng'}`;
    if(effect === 'revival'){
      fxWord.textContent = '不正解';
      await sleep(6250);
      fxWord.textContent = '正解';
      await sleep(4000);
    }else{
      fxWord.textContent = isCorrect ? '正解' : '不正解';
      await sleep(effect === 'freeze' ? 6750 : 9250);
    }
    fx.className = 'fx';
    fx.setAttribute('aria-hidden','true');
  }

  async function revealAnswer(){
    if(locked || selected === null) return;
    locked = true;
    $('answerBtn').disabled = true;
    const q = questions[current];
    const isCorrect = selected === q.answer;
    lastEffect = chooseEffect(isCorrect);

    if(lastEffect === 'freeze' || lastEffect === 'gold' || lastEffect === 'revival'){
      await sleep(900);
      await showFx(lastEffect,isCorrect);
    }else{
      await showNormalSuspense(lastEffect);
      fx.className = 'fx active';
      fxWord.className = `fx-word ${isCorrect ? 'ok' : 'ng'}`;
      fxWord.textContent = isCorrect ? '正解' : '不正解';
      fx.style.display = 'block';
      fx.querySelector('.fx-black').style.opacity = '.92';
      fxWord.style.opacity = '1';
      fxWord.style.transform = 'scale(1)';
      fxWord.style.filter = 'none';
      await sleep(520);
      fx.removeAttribute('style');
      fx.querySelector('.fx-black').removeAttribute('style');
      fxWord.removeAttribute('style');
      fx.className = 'fx';
    }

    results.push({questionIndex:current, selected, correct:isCorrect});
    renderAnswer(isCorrect);
  }

  function renderAnswer(isCorrect){
    const q = questions[current];
    const symbol = $('answerSymbol');
    symbol.textContent = isCorrect ? '○' : '×';
    symbol.className = `answer-symbol ${isCorrect ? 'ok' : 'ng'}`;
    $('answerStatus').textContent = isCorrect ? '正解' : '不正解';
    $('answerCorrect').textContent = `正解：${q.choices[q.answer]}`;
    $('answerExplanation').textContent = q.explanation;
    $('nextBtn').textContent = current === questions.length - 1 ? '結果を見る' : '次の問題へ';
    setScreen(answerScreen);
  }

  function buildResultRows(){
    const list = $('resultList');
    list.innerHTML = '';
    results.forEach((r, idx) => {
      const q = questions[r.questionIndex];
      const row = document.createElement('details');
      row.className = 'result-row';
      row.innerHTML = `
        <summary>
          <span class="result-q">Q${idx+1}</span>
          <span class="result-title"></span>
          <span class="result-mark ${r.correct ? 'ok':'ng'}">${r.correct ? '○':'×'}</span>
        </summary>
        <div class="result-detail"></div>`;
      row.querySelector('.result-title').textContent = q.song;
      const d = row.querySelector('.result-detail');
      const userAnswer = q.choices[r.selected];
      d.innerHTML = `<b>正解：${escapeHtml(q.choices[q.answer])}</b><br>あなたの回答：${escapeHtml(userAnswer)}<br><br>${escapeHtml(q.explanation)}`;
      list.appendChild(row);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
  }

  function percentileFor(score){
    const table = {0:100,10:99,20:97,30:93,40:85,50:72,60:53,70:31,80:15,90:6,100:2};
    return table[score] ?? 50;
  }

  function resultComment(correct){
    if(correct <= 2) return 'まずは定番MIXから。ここからが沼の入口。';
    if(correct <= 4) return '現場で聞いたことがあるコールが増えてきました。';
    if(correct <= 6) return '特殊MIXもかなり見えてきています。';
    if(correct <= 8) return 'だいぶ深いところまで来ています。';
    if(correct === 9) return 'あと1問。ニアジョイの特殊コールまでかなり追えています。';
    return '10問全問正解。もう説明する側です。';
  }

  function renderChart(score){
    const heights = [10,18,34,55,78,100,86,62,39,23,13];
    const chart = $('chart');
    chart.innerHTML = '';
    heights.forEach((h,i) => {
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = `${h}%`;
      if(i * 10 === score) bar.classList.add('you');
      chart.appendChild(bar);
    });
  }

  async function showFinalResult(){
    const correct = results.filter(r => r.correct).length;
    const score = correct * 10;
    scoreOverlay.classList.add('show');
    scoreOverlay.setAttribute('aria-hidden','false');
    const roller = $('rollingScore');
    const start = performance.now();
    const duration = 1900;
    while(performance.now() - start < duration){
      const elapsed = performance.now() - start;
      roller.textContent = String(Math.floor(Math.random()*11)*10).padStart(2,'0');
      const delay = elapsed > 1500 ? 150 : elapsed > 1000 ? 95 : 55;
      await sleep(delay);
    }
    roller.textContent = String(score);
    await sleep(650);
    scoreOverlay.classList.remove('show');
    scoreOverlay.setAttribute('aria-hidden','true');

    $('finalScore').textContent = score;
    $('resultSummary').textContent = `${correct} / ${questions.length} 正解　—　${resultComment(correct)}`;
    $('percentileText').textContent = `全ユーザーのうち上位 ${percentileFor(score)}%です！`;
    renderChart(score);
    buildResultRows();
    setScreen(resultScreen);
    resultScreen.scrollTop = 0;
  }

  function shareText(){
    const correct = results.filter(r => r.correct).length;
    const score = correct * 10;
    return `≒JOY コールクイズ\n${questions.length}問中${correct}問正解 / ${score}点\n上位${percentileFor(score)}%でした！\n\n#ニアジョイ #ニアジョイコールクイズ`;
  }

  $('answerBtn').addEventListener('click', revealAnswer);
  $('nextBtn').addEventListener('click', async () => {
    if(current < questions.length - 1){
      current++;
      renderQuestion();
    }else{
      await showFinalResult();
    }
  });

  $('retryBtn').addEventListener('click', () => {
    current = 0; selected = null; locked = false; results = [];
    renderQuestion();
  });

  $('shareBtn').addEventListener('click', async () => {
    const text = shareText();
    const data = {title:'≒JOY コールクイズ', text};
    if(location.protocol.startsWith('http')) data.url = location.href;
    if(navigator.share){
      try{ await navigator.share(data); }catch(e){}
    }else{
      try{ await navigator.clipboard.writeText(text + (data.url ? `\n${data.url}`:'')); $('shareBtn').textContent='コピーしました'; setTimeout(()=>$('shareBtn').textContent='結果をシェア',1400); }catch(e){}
    }
  });

  $('xBtn').addEventListener('click', () => {
    const url = location.protocol.startsWith('http') ? location.href : '';
    const target = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText())}${url ? `&url=${encodeURIComponent(url)}`:''}`;
    window.open(target,'_blank','noopener,noreferrer');
  });

  $('copyBtn').addEventListener('click', async () => {
    const text = shareText() + (location.protocol.startsWith('http') ? `\n${location.href}` : '');
    try{
      await navigator.clipboard.writeText(text);
      $('copyBtn').textContent='コピーしました';
      setTimeout(()=>$('copyBtn').textContent='結果をコピー',1400);
    }catch(e){
      const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
      $('copyBtn').textContent='コピーしました';setTimeout(()=>$('copyBtn').textContent='結果をコピー',1400);
    }
  });

  renderQuestion();
})();
</script>
</body>
</html>
